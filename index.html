<!DOCTYPE html>
<html lang="ko" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나이스(NEIS) 학사일정 달력</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Apple SD Gothic Neo', 'Pretendard', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- FullCalendar CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Apple Style Custom Scrollbar & Calendar Styling */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(150, 150, 150, 0.3); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(150, 150, 150, 0.5); }

    .fc { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
    .fc-theme-standard td, .fc-theme-standard th { border-color: rgba(229, 231, 235, 0.6); }
    .dark .fc-theme-standard td, .dark .fc-theme-standard th { border-color: rgba(55, 65, 81, 0.6); }
    .fc-toolbar-title { font-size: 1.25rem !important; font-weight: 700 !important; }
    .fc-button-primary {
      background-color: #3b82f6 !important;
      border-color: #3b82f6 !important;
      border-radius: 0.5rem !important;
      padding: 0.4rem 0.8rem !important;
      font-weight: 500 !important;
    }
    .fc-button-primary:hover { background-color: #2563eb !important; }
    .fc-event { border-radius: 6px !important; padding: 2px 4px !important; cursor: pointer; transition: transform 0.15s ease; }
    .fc-event:hover { transform: translateY(-1px); }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">

  <!-- ==========================================
       상단 헤더 (Apple 스타일 스티키 레이아웃)
  ========================================== -->
  <header class="sticky top-0 z-30 backdrop-blur-md bg-white/80 dark:bg-slate-900/80 border-b border-slate-200/80 dark:border-slate-800/80 px-4 py-3">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold shadow-md shadow-blue-500/20">
          📅
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">NEIS 학사일정 달력</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">전국 초·중·고등학교 일정 조회</p>
        </div>
      </div>

      <!-- 다크모드 & 설정 버튼 -->
      <div class="flex items-center gap-2">
        <button id="themeToggleBtn" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors">
          <span id="themeIcon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ==========================================
       메인 컨텐츠 영역
  ========================================== -->
  <main class="max-w-6xl mx-auto px-4 py-8 space-y-6">

    <!-- 1. 학교 검색 섹션 (중앙 상단) -->
    <section class="max-w-2xl mx-auto text-center space-y-4">
      <h2 class="text-2xl font-extrabold tracking-tight sm:text-3xl">
        우리 학교 학사일정을 확인해보세요
      </h2>
      <p class="text-slate-500 dark:text-slate-400 text-sm">
        학교 이름을 입력하면 나이스(NEIS) Open API에서 정규 학사일정을 바로 불러옵니다.
      </p>

      <!-- 검색창 -->
      <div class="relative max-w-xl mx-auto">
        <div class="relative flex items-center">
          <input
            type="text"
            id="schoolSearchInput"
            placeholder="학교 이름을 입력하세요 (예: 서울고, 경기중)"
            class="w-full pl-5 pr-28 py-3.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-900 dark:text-slate-100 text-sm transition"
          />
          <button
            id="searchBtn"
            class="absolute right-2 px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-xl shadow-md shadow-blue-500/20 transition-all"
          >
            검색
          </button>
        </div>

        <!-- 검색 연관 결과 드롭다운 -->
        <div
          id="searchResults"
          class="hidden absolute left-0 right-0 top-full mt-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-xl z-20 overflow-hidden max-h-72 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800 text-left"
        ></div>
      </div>
    </section>

    <!-- 2. 선택된 학교 안내 카드 -->
    <section id="selectedSchoolCard" class="hidden max-w-4xl mx-auto bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <div class="flex items-center gap-2">
            <span id="schoolKindTag" class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-100 text-blue-800 dark:bg-blue-900/50 dark:text-blue-300">고등학교</span>
            <span id="schoolRegionTag" class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300">서울특별시</span>
          </div>
          <h3 id="schoolNameHeader" class="text-xl font-bold mt-1 text-slate-900 dark:text-slate-100">서울고등학교</h3>
          <p id="schoolAddressText" class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">서울특별시 서초구 효령로 182</p>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs text-slate-400">NEIS 연동 상태: <span class="text-emerald-5-00 font-semibold">● 정상</span></span>
        </div>
      </div>
    </section>

    <!-- 3. 달력 카드 및 범례 -->
    <section class="max-w-5xl mx-auto space-y-4">
      <!-- 일정 색상 범례 -->
      <div class="flex flex-wrap items-center justify-center gap-3 text-xs bg-white/60 dark:bg-slate-900/60 backdrop-blur-sm p-3 rounded-xl border border-slate-200/60 dark:border-slate-800/60">
        <span class="font-medium text-slate-500 dark:text-slate-400">구분:</span>
        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 font-medium"><span class="w-2 h-2 rounded-full bg-amber-500"></span>시험/평가</span>
        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-blue-100 text-blue-800 dark:bg-blue-950 dark:text-blue-300 font-medium"><span class="w-2 h-2 rounded-full bg-blue-500"></span>방학/개학</span>
        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 font-medium"><span class="w-2 h-2 rounded-full bg-emerald-500"></span>휴업/공휴일</span>
        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 dark:bg-purple-950 dark:text-purple-300 font-medium"><span class="w-2 h-2 rounded-full bg-purple-500"></span>주요행사</span>
      </div>

      <!-- FullCalendar 컨테이너 -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 sm:p-6 shadow-sm min-h-[600px]">
        <div id="calendar"></div>
      </div>
    </section>
  </main>

  <!-- ==========================================
       자바스크립트 로직 (API 연동 및 이벤트 핸들링)
  ========================================== -->
  <script>
    // [설정 1] 사용자의 NEIS Open API Key 변수
    const NEIS_API_KEY = "8bad49d04cba420e829dc48dba1c61c4";

    let calendar = null;
    let currentSchool = null;

    // 카테고리별 색상 매핑
    function getCategoryStyle(eventName, restDayName) {
      const name = (eventName || '').toLowerCase();
      const rest = (restDayName || '').toLowerCase();

      if (name.includes('시험') || name.includes('고사') || name.includes('중간') || name.includes('기말') || name.includes('평가') || name.includes('모의')) {
        return { bg: '#FEF3C7', border: '#F59E0B', text: '#92400E' }; // 시험 (Amber)
      }
      if (name.includes('방학') || name.includes('개학')) {
        return { bg: '#DBEAFE', border: '#3B82F6', text: '#1E40AF' }; // 방학 (Blue)
      }
      if (rest.includes('휴업일') || rest.includes('공휴일') || name.includes('개교기념일') || name.includes('휴업') || name.includes('추석') || name.includes('설날') || name.includes('어린이날')) {
        return { bg: '#D1FAE5', border: '#10B981', text: '#065F46' }; // 공휴일 (Green)
      }
      if (name.includes('입학') || name.includes('졸업') || name.includes('체육') || name.includes('축제') || name.includes('수능') || name.includes('체험')) {
        return { bg: '#F3E8FF', border: '#A855F7', text: '#6B21A8' }; // 행사 (Purple)
      }
      return { bg: '#F1F5F9', border: '#94A3B8', text: '#334155' }; // 일반
    }

    // FullCalendar 초기화
    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');

      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'ko',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,listMonth'
        },
        buttonText: {
          today: '오늘',
          month: '월별',
          list: '목록'
        },
        events: [],
        eventClick: function(info) {
          const props = info.event.extendedProps;
          alert('📌 ' + info.event.title + '\n일자: ' + info.event.startStr + (props.cntnt ? '\n내용: ' + props.cntnt : ''));
        }
      });

      calendar.render();

      // 이벤트 리스너 등록
      document.getElementById('searchBtn').addEventListener('click', handleSearch);
      document.getElementById('schoolSearchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') handleSearch();
      });

      // 다크모드 토글
      document.getElementById('themeToggleBtn').addEventListener('click', function() {
        document.documentElement.classList.toggle('dark');
        const isDark = document.documentElement.classList.contains('dark');
        document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
      });
    });

    // 1. 학교 검색 API 호출 (https://open.neis.go.kr/hub/schoolInfo)
    async function handleSearch() {
      const query = document.getElementById('schoolSearchInput').value.trim();
      const resultsDiv = document.getElementById('searchResults');

      if (!query) {
        alert('학교 이름을 입력해주세요.');
        return;
      }

      resultsDiv.innerHTML = '<div class="p-4 text-center text-sm text-slate-500">검색 중...</div>';
      resultsDiv.classList.remove('hidden');

      try {
        const url = 'https://open.neis.go.kr/hub/schoolInfo?KEY=' + NEIS_API_KEY + '&Type=json&pIndex=1&pSize=20&SCHUL_NM=' + encodeURIComponent(query);
        const res = await fetch(url);
        const data = await res.json();

        if (data.schoolInfo && data.schoolInfo[1] && data.schoolInfo[1].row) {
          const schools = data.schoolInfo[1].row;
          renderSearchResults(schools);
        } else {
          resultsDiv.innerHTML = '<div class="p-4 text-center text-sm text-slate-500">검색 결과가 없습니다.</div>';
        }
      } catch (err) {
        console.error(err);
        resultsDiv.innerHTML = '<div class="p-4 text-center text-sm text-red-500">학교 정보를 불러오는 중 오류가 발생했습니다. (API 키 확인 필요)</div>';
      }
    }

    // 검색 결과 목록 표시
    function renderSearchResults(schools) {
      const resultsDiv = document.getElementById('searchResults');
      resultsDiv.innerHTML = '';

      schools.forEach(school => {
        const item = document.createElement('div');
        item.className = 'p-3 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer transition flex items-center justify-between';
        item.innerHTML = '<div><div class="font-bold text-sm text-slate-800 dark:text-slate-100">' + school.SCHUL_NM + '</div><div class="text-xs text-slate-500">' + (school.ORG_RDNMA || school.LCTN_SC_NM) + '</div></div><span class="text-xs px-2 py-1 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">' + school.SCHUL_KND_SC_NM + '</span>';
        
        item.addEventListener('click', () => {
          selectSchool(school);
          resultsDiv.classList.add('hidden');
        });

        resultsDiv.appendChild(item);
      });
    }

    // 학교 선택 후 학사일정 불러오기
    async function selectSchool(school) {
      currentSchool = school;

      // 상단 카드 업데이트
      document.getElementById('schoolNameHeader').textContent = school.SCHUL_NM;
      document.getElementById('schoolKindTag').textContent = school.SCHUL_KND_SC_NM;
      document.getElementById('schoolRegionTag').textContent = school.LCTN_SC_NM;
      document.getElementById('schoolAddressText').textContent = school.ORG_RDNMA || '주소 정보 없음';
      document.getElementById('selectedSchoolCard').classList.remove('hidden');

      // 2. 학사일정 API 호출 (https://open.neis.go.kr/hub/SchoolSchedule)
      const officeCode = school.ATPT_OFCDC_SC_CODE; // 시도교육청코드
      const schoolCode = school.SD_SCHUL_CODE;       // 행정표준코드 (학교코드)

      const now = new Date();
      const currentYear = now.getFullYear();
      const fromYmd = currentYear + '0101';
      const toYmd = currentYear + '1231';

      try {
        const scheduleUrl = 'https://open.neis.go.kr/hub/SchoolSchedule?KEY=' + NEIS_API_KEY + '&Type=json&pIndex=1&pSize=1000&ATPT_OFCDC_SC_CODE=' + officeCode + '&SD_SCHUL_CODE=' + schoolCode + '&AA_FROM_YMD=' + fromYmd + '&AA_TO_YMD=' + toYmd;
        const res = await fetch(scheduleUrl);
        const data = await res.json();

        calendar.removeAllEvents();

        if (data.SchoolSchedule && data.SchoolSchedule[1] && data.SchoolSchedule[1].row) {
          const rows = data.SchoolSchedule[1].row;ㅑㅜ

          rows.forEach(row => {
            const ymd = row.AA_YMD;
            const formattedDate = ymd.substring(0,4) + '-' + ymd.substring(4,6) + '-' + ymd.substring(6,8);
            const style = getCategoryStyle(row.EVENT_NM, row.SBTR_DD_SC_NM);

            calendar.addEvent({
              title: row.EVENT_NM,
              start: formattedDate,
              backgroundColor: style.bg,
              borderColor: style.border,
              textColor: style.text,
              extendedProps: {
                cntnt: row.EVENT_CNTNT,
                rest: row.SBTR_DD_SC_NM
              }
            });
          });
        }
      } catch (err) {
        console.error(err);
        alert('학사일정을 불러오는 중 오류가 발생했습니다.');
      }
    }
  </script>
</body>
</html>
